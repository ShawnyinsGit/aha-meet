# Cross-platform build for AhaMeet
#
# Produces installers for macOS (DMG), Windows (NSIS), and Linux (AppImage + deb).
# Trigger: manual dispatch or tag push (v*).
#
# Platform notes:
#   macOS  — installs whisper-cpp via Homebrew for native voice recognition.
#   Win/Linux — whisper prebuilt download attempted; falls back to browser ASR
#               if the GitHub release binary is unavailable.
#   claude-defaults — the bundle-claude-defaults.mjs script exits gracefully
#               when ~/.claude is absent (CI has no user config); the app
#               works without bundled defaults.

name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  VIBE_MEET_CACHE_DIR: ${{ github.workspace }}/.asset-cache

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache build assets
        uses: actions/cache@v4
        with:
          path: .asset-cache
          key: macos-assets-${{ hashFiles('scripts/fetch-whisper.mjs', 'scripts/fetch-speaker-model.mjs') }}
          restore-keys: macos-assets-

      - name: Install whisper-cpp (Homebrew)
        run: brew install whisper-cpp

      - name: npm install
        run: npm ci

      - name: Prebuild — whisper
        run: node scripts/fetch-whisper.mjs

      - name: Prebuild — speaker model
        run: node scripts/fetch-speaker-model.mjs

      - name: Prebuild — claude defaults
        run: node scripts/bundle-claude-defaults.mjs

      - name: Build + Package
        run: npm run build && npx electron-builder --mac --arm64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-arm64
          path: release/*.dmg
          retention-days: 30

  windows:
    name: Windows (x64 + arm64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache build assets
        uses: actions/cache@v4
        with:
          path: .asset-cache
          key: win-assets-${{ hashFiles('scripts/fetch-whisper.mjs', 'scripts/fetch-speaker-model.mjs') }}
          restore-keys: win-assets-

      - name: npm install
        run: npm ci

      - name: Prebuild — whisper (fallback to browser ASR if no prebuilt)
        run: node scripts/fetch-whisper.mjs
        continue-on-error: true

      - name: Prebuild — speaker model
        run: node scripts/fetch-speaker-model.mjs

      - name: Prebuild — claude defaults
        run: node scripts/bundle-claude-defaults.mjs

      - name: Build + Package
        run: npm run build && npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: release/*.exe
          retention-days: 30
          if-no-files-found: ignore

  linux:
    name: Linux (x64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache build assets
        uses: actions/cache@v4
        with:
          path: .asset-cache
          key: linux-assets-${{ hashFiles('scripts/fetch-whisper.mjs', 'scripts/fetch-speaker-model.mjs') }}
          restore-keys: linux-assets-

      - name: npm install
        run: npm ci

      - name: Prebuild — whisper (fallback to browser ASR if no prebuilt)
        run: node scripts/fetch-whisper.mjs
        continue-on-error: true

      - name: Prebuild — speaker model
        run: node scripts/fetch-speaker-model.mjs

      - name: Prebuild — claude defaults
        run: node scripts/bundle-claude-defaults.mjs

      - name: Build + Package
        run: npm run build && npx electron-builder --linux --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release/*.AppImage
          retention-days: 30
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: release/*.deb
          retention-days: 30
          if-no-files-found: ignore
